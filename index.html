<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Open Road</title>
<style>html,body{margin:0;height:100%;background:#111;overflow:hidden;touch-action:none}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* OPEN ROAD - drive a convertible across an endless world.
   W/Up gas | S/Down brake+reverse | A/D or Left/Right steer | Space handbrake drift | M mute
   Touch/mouse: hold and drag left/right of centre to steer. Reach the gold flag, grab gems. */
const cv = document.getElementById('c'), g = cv.getContext('2d');
const dark = document.createElement('canvas'), dg = dark.getContext('2d');
let W, H, DPR;
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = dark.width = W * DPR; cv.height = dark.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
}
addEventListener('resize', resize); resize();

// ---------- deterministic world ----------
function h(x, y, s) {
  let n = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 1274126177)) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177); n ^= n >>> 16; return (n >>> 0) / 4294967296;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = h(xi, yi, 7), b = h(xi + 1, yi, 7), c = h(xi, yi + 1, 7), d = h(xi + 1, yi + 1, 7);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const terr = (x, y) => vnoise(x / 1800, y / 1800) * 0.7 + vnoise(x / 600 + 50, y / 600 + 9) * 0.3;
const PAL = { desert: ['#d8b46a', '#d1ab5f'], grass: ['#4e9b47', '#58a64f'], snow: ['#e9f1f6', '#dde8ef'] };
const biome = t => t < 0.38 ? 'desert' : t > 0.62 ? 'snow' : 'grass';
const G = 1400, RW = 58, S = 32;
const ox = y => Math.sin(y / 500) * 120, oy = x => Math.sin(x / 600) * 120;
const md = (a, m) => ((a % m) + m) % m;
function road(x, y) {
  const dv = Math.abs(md(x + ox(y) + G / 2, G) - G / 2), dh = Math.abs(md(y + oy(x) + G / 2, G) - G / 2);
  return dv < dh ? { d: dv, v: 1 } : { d: dh, v: 0 };
}
const C = 240, chunks = new Map(), taken = new Set();
function chunk(cx, cy) {
  const k = cx + ',' + cy; let c = chunks.get(k); if (c) return c;
  c = { objs: [], gems: [] };
  const n = Math.floor(h(cx, cy, 1) * 7);
  for (let i = 0; i < n; i++) {
    const x = cx * C + h(cx, cy, 10 + i) * C, y = cy * C + h(cx, cy, 30 + i) * C;
    if (road(x, y).d < RW + 40) continue;
    const t = terr(x, y), s = h(cx, cy, 70 + i);
    c.objs.push({ x, y, r: 14 + h(cx, cy, 50 + i) * 6, s, type: s < 0.15 ? 'rock' : t < 0.38 ? 'cactus' : t > 0.62 ? 'pine' : 'tree' });
  }
  if (h(cx, cy, 2) < 0.5) c.gems.push({ x: cx * C + h(cx, cy, 3) * C, y: cy * C + h(cx, cy, 4) * C, k: k });
  chunks.set(k, c); return c;
}

// ---------- state ----------
const car = { x: 0, y: 0, a: -Math.PI / 2, vx: 0, vy: 0, steer: 0 };
const cam = { x: 0, y: 0, z: 1 };
const keys = {}; let ptr = null, muted = false, shake = 0, time = 0, score = 0, gems = 0, trips = 0, dist = 0, toast = { t: 0, s: '' };
const skids = [], dust = [];
const NAMES = ['Sunrise Bay', 'Pinewood', 'Dune City', 'Frostgate', 'Maple Hollow', 'Copper Ridge', 'Starfall', 'Willow Creek', 'Echo Valley', 'Port Aurora'];
let dest = null;
function newDest() {
  for (let i = 0; i < 50; i++) {
    const y = car.y + (Math.random() - 0.5) * 8000, x0 = car.x + (Math.random() - 0.5) * 8000;
    const x = Math.round((x0 + ox(y)) / G) * G - ox(y);
    if (Math.hypot(x - car.x, y - car.y) > 2000) { dest = { x, y, name: NAMES[Math.floor(Math.random() * NAMES.length)] }; return; }
  }
  dest = { x: car.x + 2500, y: car.y, name: 'Far Away' };
}
newDest();

// ---------- input ----------
addEventListener('keydown', e => { keys[e.code] = true; initAudio(); if (e.code === 'Space') e.preventDefault(); if (e.code === 'KeyM') muted = !muted; });
addEventListener('keyup', e => keys[e.code] = false);
cv.addEventListener('pointerdown', e => { ptr = { x: e.clientX }; initAudio(); });
cv.addEventListener('pointermove', e => { if (ptr) ptr.x = e.clientX; });
addEventListener('pointerup', () => ptr = null);

// ---------- audio ----------
let ac, osc, gn;
function initAudio() {
  if (ac) return;
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)(); osc = ac.createOscillator(); osc.type = 'sawtooth';
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 500; gn = ac.createGain(); gn.gain.value = 0;
    osc.connect(lp); lp.connect(gn); gn.connect(ac.destination); osc.start();
  } catch (e) { ac = null; }
}
function blip(f1, f2, dur, vol) {
  if (!ac || muted) return; const o = ac.createOscillator(), v = ac.createGain(), t = ac.currentTime;
  o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  v.gain.setValueAtTime(vol, t); v.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(v); v.connect(ac.destination); o.start(t); o.stop(t + dur);
}

// ---------- update ----------
function update(dt) {
  time += dt;
  const fx = Math.cos(car.a), fy = Math.sin(car.a), lx = -fy, ly = fx;
  let fwd = car.vx * fx + car.vy * fy, lat = car.vx * lx + car.vy * ly;
  const r = road(car.x, car.y), onRoad = r.d < RW, t = terr(car.x, car.y), bm = biome(t);
  let thr = (keys.KeyW || keys.ArrowUp) ? 1 : 0, brk = (keys.KeyS || keys.ArrowDown) ? 1 : 0;
  let st = ((keys.KeyD || keys.ArrowRight) ? 1 : 0) - ((keys.KeyA || keys.ArrowLeft) ? 1 : 0);
  if (ptr) { thr = 1; st = Math.max(-1, Math.min(1, (ptr.x - W / 2) / (W / 4))); }
  const hb = keys.Space;
  const vmax = onRoad ? 440 : bm === 'snow' ? 230 : 270;
  let grip = onRoad ? 7 : bm === 'snow' ? 2 : 3.5;
  if (hb) grip = 1.1;
  if (thr) fwd += 300 * Math.max(0, 1 - fwd / vmax) * dt;
  if (brk) fwd += (fwd > 20 ? -520 : -170) * dt;
  fwd -= fwd * (onRoad ? 0.35 : bm === 'desert' ? 1.3 : 0.9) * dt; if (hb) fwd *= Math.exp(-0.9 * dt);
  lat *= Math.exp(-grip * dt);
  car.steer += (st - car.steer) * Math.min(1, dt * 8);
  car.a += car.steer * 2.7 * dt * Math.max(-1, Math.min(1, fwd / 140)) * (1 - 0.35 * Math.min(1, Math.abs(fwd) / 450));
  const nx = Math.cos(car.a), ny = Math.sin(car.a);
  car.vx = nx * fwd - ny * lat; car.vy = ny * fwd + nx * lat;
  car.x += car.vx * dt; car.y += car.vy * dt;
  const sp = Math.hypot(car.vx, car.vy); dist += sp * dt;

  // solid scenery
  const cx0 = Math.floor(car.x / C), cy0 = Math.floor(car.y / C);
  for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) {
    const c = chunk(cx0 + i, cy0 + j);
    for (const o of c.objs) {
      const dx = car.x - o.x, dy = car.y - o.y, d = Math.hypot(dx, dy), R = o.r + 14;
      if (d < R && d > 0.01) {
        const nx2 = dx / d, ny2 = dy / d, vn = car.vx * nx2 + car.vy * ny2;
        car.x = o.x + nx2 * R; car.y = o.y + ny2 * R;
        if (vn < 0) { car.vx -= 1.4 * vn * nx2; car.vy -= 1.4 * vn * ny2; car.vx *= 0.7; car.vy *= 0.7; shake = Math.min(10, -vn / 30); if (-vn > 40) blip(120, 40, 0.18, 0.25); }
      }
    }
    for (const gm of c.gems) {
      if (!taken.has(gm.k) && Math.hypot(car.x - gm.x, car.y - gm.y) < 34) { taken.add(gm.k); gems++; score += 10; blip(880, 1500, 0.18, 0.12); }
    }
  }
  if (Math.hypot(car.x - dest.x, car.y - dest.y) < 90) {
    trips++; score += 100; toast = { t: 3, s: 'Arrived at ' + dest.name + '!  +100' }; blip(520, 1040, 0.4, 0.2); newDest();
  }

  // skids + dust
  const rear = [[-18, -12], [-18, 12]];
  if (Math.abs(lat) > 55 || (hb && sp > 80)) rear.forEach(p => skids.push({ x: car.x + nx * p[0] - ny * p[1], y: car.y + ny * p[0] + nx * p[1], t: 6 }));
  if (skids.length > 700) skids.splice(0, skids.length - 700);
  if (sp > 60 && (!onRoad || Math.abs(lat) > 70)) {
    const col = onRoad ? '#ddd' : bm === 'snow' ? '#fff' : bm === 'desert' ? '#e8cf92' : '#8a6d4b';
    dust.push({ x: car.x - nx * 22 + (Math.random() - .5) * 14, y: car.y - ny * 22 + (Math.random() - .5) * 14, vx: -car.vx * 0.15 + (Math.random() - .5) * 30, vy: -car.vy * 0.15 + (Math.random() - .5) * 30, life: 0.7, col });
  }
  for (let i = dust.length - 1; i >= 0; i--) { const p = dust[i]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.life <= 0) dust.splice(i, 1); }
  for (const s of skids) s.t -= dt; while (skids.length && skids[0].t <= 0) skids.shift();

  // camera
  const tz = 1 - Math.min(sp, 450) / 450 * 0.25; cam.z += (tz - cam.z) * Math.min(1, dt * 2);
  cam.x += (car.x + car.vx * 0.25 - cam.x) * Math.min(1, dt * 5); cam.y += (car.y + car.vy * 0.25 - cam.y) * Math.min(1, dt * 5);
  shake *= Math.exp(-dt * 8); if (toast.t > 0) toast.t -= dt;
  if (ac) { osc.frequency.value = 45 + sp * 0.28; gn.gain.value = muted ? 0 : 0.03 + Math.min(sp / 450, 1) * 0.05; }
  return { sp, lat, fwd };
}

// ---------- drawing ----------
function drawObj(o) {
  g.save(); g.translate(o.x, o.y);
  g.fillStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(6, 8, o.r * 1.1, o.r * 0.75, 0, 0, 7); g.fill();
  if (o.type === 'tree') { circ(0, 0, o.r * 1.5, '#2f7d32'); circ(-3, -4, o.r * 1.05, '#3f9a43'); circ(-6, -8, o.r * 0.5, '#58b85b'); }
  else if (o.type === 'pine') { circ(0, 0, o.r * 1.3, '#1f5f3a'); circ(-2, -2, o.r * 0.9, '#2b7a4d'); circ(-3, -4, o.r * 0.55, '#f4faff'); }
  else if (o.type === 'cactus') { g.strokeStyle = '#3d8b4f'; g.lineCap = 'round'; g.lineWidth = 9; g.beginPath(); g.moveTo(0, 0); g.lineTo(0, 0.01); g.stroke(); g.lineWidth = 5; g.beginPath(); g.moveTo(-6, -2); g.lineTo(-14, -8); g.moveTo(6, 2); g.lineTo(14, 9); g.stroke(); circ(0, 0, 8, '#4aa05c'); circ(-2, -2, 3, '#7ccf8c'); }
  else { circ(0, 0, o.r, '#7b7f87'); circ(-3, -3, o.r * 0.65, '#9aa0a8'); }
  g.restore();
}
function circ(x, y, r, c) { g.fillStyle = c; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }
function rrect(x, y, w, h2, r, c) { g.fillStyle = c; g.beginPath(); g.roundRect(x, y, w, h2, r); g.fill(); }

function drawCar(lat) {
  g.save(); g.translate(car.x, car.y); g.rotate(car.a);
  g.fillStyle = 'rgba(0,0,0,.3)'; g.beginPath(); g.ellipse(3, 5, 30, 16, 0, 0, 7); g.fill();
  [[16, -14], [16, 14], [-16, -14], [-16, 14]].forEach((w, i) => { g.save(); g.translate(w[0], w[1]); if (i < 2) g.rotate(car.steer * 0.5); rrect(-6, -3, 12, 6, 2, '#15151a'); g.restore(); });
  rrect(-27, -13, 54, 26, 9, '#e63946'); rrect(8, -9, 18, 18, 6, '#f15b66');
  rrect(-17, -9, 24, 18, 5, '#2b2d42');                 // open cockpit
  rrect(-15, -8, 8, 7, 3, '#8d5a3b'); rrect(-15, 1, 8, 7, 3, '#8d5a3b'); // seats
  rrect(7, -10, 3, 20, 1, '#9ad1ff');                     // windshield
  circ(-10, -4.5, 4.5, '#f4a261'); circ(-11, -4.5, 3.6, '#4a2f1b'); // driver
  circ(-10, 4.5, 4, '#c98f5b'); circ(-10, 2, 1.8, '#a06a3a'); circ(-10, 7, 1.8, '#a06a3a'); // dog
  g.strokeStyle = '#ffd166'; g.lineWidth = 3; g.lineCap = 'round'; g.beginPath(); // scarf
  const w = Math.sin(time * 18) * 2; g.moveTo(-13, -4.5); g.quadraticCurveTo(-22, -4.5 + w, -30, -4.5 - w * 1.5); g.stroke();
  rrect(25, -11, 3, 6, 1, '#fff6c0'); rrect(25, 5, 3, 6, 1, '#fff6c0'); rrect(-28, -11, 2, 5, 1, '#ff2b2b'); rrect(-28, 6, 2, 5, 1, '#ff2b2b');
  g.restore();
}

function draw(info) {
  const z = cam.z, sx = (Math.random() - .5) * shake, sy = (Math.random() - .5) * shake;
  g.setTransform(DPR * z, 0, 0, DPR * z, DPR * (W / 2 - cam.x * z + sx), DPR * (H / 2 - cam.y * z + sy));
  const vw = W / z, vh = H / z, L = cam.x - vw / 2 - 50, T = cam.y - vh / 2 - 50, R = cam.x + vw / 2 + 50, B = cam.y + vh / 2 + 50;
  for (let y = Math.floor(T / S) * S; y < B; y += S) for (let x = Math.floor(L / S) * S; x < R; x += S) {
    const mx = x + S / 2, my = y + S / 2, rd = road(mx, my);
    let col = PAL[biome(terr(mx, my))][h(x / S, y / S, 3) > 0.5 ? 1 : 0];
    if (rd.d < RW) {
      col = '#3b3b44';
      if (rd.d > RW - 7) col = '#d9d9de';
      else if (rd.d < 3 && Math.floor((rd.v ? my : mx) / 40) % 2 === 0) col = '#f2c94c';
    } else if (rd.d < RW + 14) col = 'rgba(70,60,50,.35)';
    g.fillStyle = col; g.fillRect(x, y, S + 1, S + 1);
    if (rd.d >= RW && rd.d < RW + 14) { g.fillStyle = PAL[biome(terr(mx, my))][0]; g.globalAlpha = .6; g.fillRect(x, y, S + 1, S + 1); g.globalAlpha = 1; g.fillStyle = col; g.fillRect(x, y, S + 1, S + 1); }
  }
  for (const s of skids) { g.globalAlpha = Math.min(1, s.t / 3) * 0.5; circ(s.x, s.y, 2.2, '#111'); } g.globalAlpha = 1;
  const objs = [], cx0 = Math.floor(L / C), cx1 = Math.floor(R / C), cy0 = Math.floor(T / C), cy1 = Math.floor(B / C);
  for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++) {
    const c = chunk(cx, cy); c.objs.forEach(o => objs.push(o));
    for (const gm of c.gems) if (!taken.has(gm.k)) {
      const p = 1 + Math.sin(time * 4 + gm.x) * 0.15; g.save(); g.translate(gm.x, gm.y); g.rotate(time * 2); g.scale(p, p);
      g.fillStyle = 'rgba(120,230,255,.25)'; g.beginPath(); g.arc(0, 0, 22, 0, 7); g.fill();
      g.fillStyle = '#6ee7ff'; g.beginPath(); g.moveTo(0, -12); g.lineTo(9, 0); g.lineTo(0, 12); g.lineTo(-9, 0); g.fill();
      g.fillStyle = '#d5f8ff'; g.beginPath(); g.moveTo(0, -12); g.lineTo(4, 0); g.lineTo(0, 3); g.lineTo(-4, 0); g.fill(); g.restore();
    }
  }
  // destination
  g.save(); g.translate(dest.x, dest.y);
  for (let i = 0; i < 3; i++) { g.strokeStyle = 'rgba(255,209,102,' + (0.7 - i * 0.2) + ')'; g.lineWidth = 4; g.beginPath(); g.arc(0, 0, 50 + i * 14 + Math.sin(time * 3 - i) * 5, 0, 7); g.stroke(); }
  rrect(-3, -34, 6, 38, 2, '#fff'); g.fillStyle = '#ffd166'; g.beginPath(); g.moveTo(3, -34); g.lineTo(32, -26 + Math.sin(time * 5) * 3); g.lineTo(3, -16); g.fill(); g.restore();
  objs.sort((a, b) => a.y - b.y).forEach(drawObj);
  for (const p of dust) { g.globalAlpha = Math.max(0, p.life / 0.7) * 0.6; circ(p.x, p.y, 4 + (0.7 - p.life) * 12, p.col); } g.globalAlpha = 1;
  drawCar(info.lat);

  // day / night
  const a = 0.5 - 0.5 * Math.cos(time * 2 * Math.PI / 140), night = Math.pow(a, 1.4) * 0.72;
  g.setTransform(1, 0, 0, 1, 0, 0);
  if (night > 0.02) {
    dg.setTransform(DPR, 0, 0, DPR, 0, 0); dg.globalCompositeOperation = 'source-over'; dg.clearRect(0, 0, W, H);
    dg.fillStyle = 'rgba(6,10,40,' + night + ')'; dg.fillRect(0, 0, W, H);
    dg.globalCompositeOperation = 'destination-out';
    const cx = W / 2 - (cam.x - car.x) * z, cy = H / 2 - (cam.y - car.y) * z;
    dg.save(); dg.translate(cx, cy); dg.rotate(car.a);
    const gr = dg.createRadialGradient(0, 0, 10, 0, 0, 380 * z); gr.addColorStop(0, 'rgba(255,255,255,.95)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    dg.fillStyle = gr; dg.beginPath(); dg.moveTo(0, 0); dg.arc(0, 0, 380 * z, -0.5, 0.5); dg.closePath(); dg.fill();
    const g2 = dg.createRadialGradient(0, 0, 5, 0, 0, 80 * z); g2.addColorStop(0, 'rgba(255,255,255,.7)'); g2.addColorStop(1, 'rgba(255,255,255,0)');
    dg.fillStyle = g2; dg.beginPath(); dg.arc(0, 0, 80 * z, 0, 7); dg.fill(); dg.restore();
    g.drawImage(dark, 0, 0, W * DPR, H * DPR);
  }
  // HUD
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const ang = Math.atan2(dest.y - car.y, dest.x - car.x), dd = Math.hypot(dest.x - car.x, dest.y - car.y);
  const cx = W / 2 - (cam.x - car.x) * z, cy = H / 2 - (cam.y - car.y) * z;
  g.save(); g.translate(cx + Math.cos(ang) * 95 * z, cy + Math.sin(ang) * 95 * z); g.rotate(ang);
  g.fillStyle = '#ffd166'; g.strokeStyle = 'rgba(0,0,0,.5)'; g.lineWidth = 2; g.beginPath(); g.moveTo(14, 0); g.lineTo(-8, -9); g.lineTo(-4, 0); g.lineTo(-8, 9); g.closePath(); g.fill(); g.stroke(); g.restore();
  g.fillStyle = '#fff'; g.shadowColor = 'rgba(0,0,0,.7)'; g.shadowBlur = 6; g.textAlign = 'left';
  g.font = '700 38px system-ui,sans-serif'; g.fillText(Math.round(info.sp * 0.36), 20, 52);
  g.font = '12px system-ui,sans-serif'; g.fillText('KM/H', 22, 70);
  g.textAlign = 'right'; g.font = '600 16px system-ui,sans-serif'; g.fillText('Score ' + score, W - 20, 34);
  g.font = '13px system-ui,sans-serif'; g.fillText('Gems ' + gems + '  |  Trips ' + trips + '  |  ' + (dist / 1000).toFixed(1) + ' km', W - 20, 56);
  g.textAlign = 'center'; g.font = '600 15px system-ui,sans-serif'; g.fillStyle = '#ffd166';
  g.fillText('Next stop: ' + dest.name + '  -  ' + (dd / 100).toFixed(1) + ' km', W / 2, H - 40);
  if (time < 10) { g.fillStyle = 'rgba(255,255,255,.9)'; g.font = '13px system-ui,sans-serif'; g.fillText('W/Up gas  S/Down brake  A/D steer  Space drift  M mute  |  Touch: hold & drag', W / 2, H - 18); }
  if (toast.t > 0) { g.globalAlpha = Math.min(1, toast.t); g.fillStyle = '#ffd166'; g.font = '700 28px system-ui,sans-serif'; g.fillText(toast.s, W / 2, 100); g.globalAlpha = 1; }
  g.shadowBlur = 0;
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  draw(update(dt)); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
